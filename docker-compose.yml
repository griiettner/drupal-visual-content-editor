services:
  drupal:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      # Custom modules - persisted for development
      - ./web/modules/custom:/var/www/html/modules/custom
      # Custom themes - persisted for development
      - ./web/themes/custom:/var/www/html/themes/custom
      # Persist Drupal site settings across rebuilds
      - ./web/sites/default/settings.php:/var/www/html/sites/default/settings.php
      - ./web/sites/default/settings.local.php:/var/www/html/sites/default/settings.local.php
      - ./web/sites/development.services.yml:/var/www/html/sites/development.services.yml
      # Media/uploaded files - persisted
      - ./web/sites/default/files:/var/www/html/sites/default/files
      # Configuration sync directory
      - ./config/sync:/var/www/html/config/sync
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: drupal
      POSTGRES_USER: drupal
      POSTGRES_PASSWORD: drupal
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: drupal
      POSTGRES_USER: drupal
      POSTGRES_PASSWORD: drupal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drupal -d drupal"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
